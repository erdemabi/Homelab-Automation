name: First Workflow Run

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create file
        run: |
          echo "Hello from first job" > result.txt
          ls -la

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: result-file
          path: result.txt

  second-job:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Download result
        uses: actions/download-artifact@v8
        with:
          name: result-file

      - name: Check files
        run: |
          echo "Files in second job:"
          ls -la
          echo "File content:"
          cat result.txt
