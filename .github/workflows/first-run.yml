name: First Workflow Run

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create file
        run: |
          echo "Hello from first job" > result.txt
          ls -la

      - name: Set version
        id: set-version
        run: echo "version=v1.2.3" >> "$GITHUB_OUTPUT"

      - name: Upload result
        uses: actions/upload-artifact@v7
        with:
          name: result-file
          path: result.txt

  second-job:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Download result
        uses: actions/download-artifact@v8
        with:
          name: result-file

      - name: Check files
        run: |
          echo "Files in second job:"
          ls -la
          echo "File content:"
          cat result.txt

  third-job:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Show version
        run: echo "Version = ${{ needs.hello.outputs.version }}"
