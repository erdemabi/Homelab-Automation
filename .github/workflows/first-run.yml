name: First Workflow Run

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show basic info
        run: |
          echo "Hello from GitHub Actions"
          echo "Branch: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"
          echo "Runner OS: $RUNNER_OS"

      - name: Finish
        run: echo "First job completed"

  second-job:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Start second job
        run: echo "Hello job finished, second job started"

      - name: Finish second job
        run: echo "Second job completed"
