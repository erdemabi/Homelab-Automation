name: First Workflow Run

on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create file
        run: |
          echo "Hello from first job" > result.txt
          ls -la

  second-job:
    needs: hello
    runs-on: ubuntu-latest

    steps:
      - name: Check files
        run: |
          echo "Files in second job:"
          ls -la
